<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XRPRippleFlare - Crypto App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
}

/* HEADER */
header {
  padding: 15px;
  background: #0f172a;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 { color: #38bdf8; margin: 0; font-size: 20px; }

/* LAYOUT */
.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap: 15px;
}

/* CARDS */
.card {
  background: #111827;
  padding: 15px;
  border-radius: 12px;
}

.value {
  color: #22c55e;
  font-size: 18px;
  word-break: break-all;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  background: #38bdf8;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #0ea5e9; }

input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 6px;
  border: none;
}

/* STATUS */
.hidden { display: none; }

.small {
  color: #94a3b8;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>XRPRippleFlare Crypto App</h1>
  <button onclick="disconnect()">Disconnect</button>
</header>

<div class="container">

<!-- CONNECT -->
<div id="connectBox" class="card">
  <h2>Connect Wallet</h2>
  <button onclick="connectMetaMask()">MetaMask</button>
  <button onclick="connectWalletConnect()">WalletConnect</button>
  <p id="error" style="color:red;"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <div class="grid">

    <div class="card">
      <h3>Wallet</h3>
      <div class="value" id="wallet"></div>
      <div class="small">Connected Address</div>
    </div>

    <div class="card">
      <h3>ETH Balance</h3>
      <div class="value" id="eth"></div>
    </div>

    <div class="card">
      <h3>XRP Price</h3>
      <div class="value" id="xrp"></div>
    </div>

    <div class="card">
      <h3>BTC Price</h3>
      <div class="value" id="btc"></div>
    </div>

  </div>

  <!-- SEND ETH -->
  <div class="card" style="margin-top:20px;">
    <h3>Send ETH</h3>
    <input id="to" placeholder="Recipient address" />
    <input id="amount" placeholder="Amount (ETH)" />
    <button onclick="sendETH()">Send</button>
    <p id="txStatus"></p>
  </div>

</div>

</div>

<!-- WALLETCONNECT -->
<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.6/dist/index.umd.js"></script>

<script>
let provider;
let signer;
let wcProvider;

// CONNECT METAMASK
async function connectMetaMask() {
  try {
    if (!window.ethereum) {
      error("MetaMask not found");
      return;
    }

    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();

    const addr = await signer.getAddress();

    showApp(addr);
    loadData();

  } catch (e) {
    error(e.message);
  }
}

// WALLETCONNECT
async function connectWalletConnect() {
  try {
    const { EthereumProvider } = window.WalletConnectEthereumProvider;

    wcProvider = await EthereumProvider.init({
      projectId: "YOUR_PROJECT_ID_HERE",
      chains: [1],
      showQrModal: true
    });

    await wcProvider.connect();

    provider = new ethers.providers.Web3Provider(wcProvider);
    signer = provider.getSigner();

    const addr = await signer.getAddress();

    showApp(addr);
    loadData();

  } catch (e) {
    error(e.message);
  }
}

// SHOW APP
function showApp(addr) {
  document.getElementById("connectBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("wallet").innerText = addr;
}

// LOAD DATA
async function loadData() {
  const bal = await provider.getBalance(await signer.getAddress());
  document.getElementById("eth").innerText =
    parseFloat(ethers.utils.formatEther(bal)).toFixed(4) + " ETH";

  // XRP
  const xrp = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=ripple&vs_currencies=usd")
    .then(r => r.json());
  document.getElementById("xrp").innerText = "$" + xrp.ripple.usd;

  // BTC
  const btc = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd")
    .then(r => r.json());
  document.getElementById("btc").innerText = "$" + btc.bitcoin.usd;
}

// SEND ETH
async function sendETH() {
  try {
    const txStatus = document.getElementById("txStatus");

    const tx = await signer.sendTransaction({
      to: document.getElementById("to").value,
      value: ethers.utils.parseEther(document.getElementById("amount").value)
    });

    txStatus.innerText = "Sending... " + tx.hash;

    await tx.wait();

    txStatus.innerText = "Confirmed ✅";

  } catch (e) {
    document.getElementById("txStatus").innerText = e.message;
  }
}

// DISCONNECT
function disconnect() {
  provider = null;
  signer = null;
  location.reload();
}

// ERROR
function error(msg) {
  document.getElementById("error").innerText = msg;
}
</script>

</body>
</html>
