<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XRPRippleFlare Exchange</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script type="module">
import { createWeb3Modal, defaultConfig } from "https://unpkg.com/@web3modal/ethers@4.2.3/dist/index.js";

/* WALLET CONFIG */
const projectId = "6eb8ae24484e78bb6c25a73a7195d774";

const mainnet = {
  chainId: 1,
  name: "Ethereum",
  currency: "ETH",
  explorerUrl: "https://etherscan.io",
  rpcUrl: "https://cloudflare-eth.com"
};

const metadata = {
  name: "XRPRippleFlare",
  description: "Wallet-Agnostic Exchange dApp",
  url: window.location.origin,
  icons: []
};

/* CREATE MODAL */
const modal = createWeb3Modal({
  ethersConfig: defaultConfig({ metadata }),
  chains: [mainnet],
  projectId
});

/* EXPOSE */
window.modal = modal;

/* CONNECT FUNCTION */
window.connectWallet = async () => {
  const provider = await modal.open();

  const signer = provider.getSigner();
  const address = await signer.getAddress();

  document.getElementById("wallet").innerText = address;
  document.getElementById("dashboard").style.display = "block";
};
</script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1c;
  color: white;
}

.topbar {
  padding: 15px;
  background: #0f172a;
  display: flex;
  justify-content: space-between;
}

button {
  padding: 12px;
  border: none;
  background: #38bdf8;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
}

button:hover { background: #0ea5e9; }

.container {
  padding: 20px;
}

.card {
  background: #111827;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
}

.value {
  color: #22c55e;
  word-break: break-all;
}
</style>
</head>

<body>

<div class="topbar">
  <h2>XRPRippleFlare Exchange</h2>
  <button onclick="connectWallet()">Connect Wallet</button>
</div>

<div class="container">

<div id="dashboard" class="card" style="display:none;">
  <h3>Wallet Connected</h3>
  <div id="wallet" class="value"></div>
</div>

</div>

</body>
</html>
