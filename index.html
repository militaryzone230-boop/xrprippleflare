<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XRPRippleFlare Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
  }

  header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #1e293b;
  }

  h1 { color: #38bdf8; margin: 0; }

  .wrap {
    max-width: 900px;
    margin: auto;
    padding: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .card {
    background: #0f172a;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(56,189,248,0.08);
  }

  button {
    padding: 12px 16px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #38bdf8;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover { background: #0ea5e9; }

  .value {
    color: #22c55e;
    word-break: break-all;
  }

  .label {
    font-size: 13px;
    color: #94a3b8;
  }

  .hidden { display: none; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .badge {
    padding: 5px 10px;
    background: #1e293b;
    border-radius: 20px;
    font-size: 12px;
  }

  .error { color: #ef4444; }
</style>
</head>

<body>

<header>
  <h1>XRPRippleFlare</h1>
  <p>Pro Web3 Dashboard</p>
</header>

<div class="wrap">

  <!-- CONNECT VIEW -->
  <div id="connectView" class="card">
    <h2>Connect Wallet</h2>
    <p>Access your Web3 dashboard</p>
    <button onclick="connectWallet()">Connect MetaMask</button>
    <div id="error" class="error"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="topbar">
      <h2>Dashboard</h2>
      <span class="badge" id="networkBadge">Network</span>
    </div>

    <div class="grid">

      <div class="card">
        <div class="label">Wallet Address</div>
        <div class="value" id="wallet"></div>
      </div>

      <div class="card">
        <div class="label">ETH Balance</div>
        <div class="value" id="balance"></div>
      </div>

      <div class="card">
        <div class="label">XRP Price (Live)</div>
        <div class="value" id="xrpPrice">Loading...</div>
      </div>

      <div class="card">
        <div class="label">Actions</div>
        <button onclick="disconnect()">Disconnect Wallet</button>
      </div>

    </div>
  </div>

</div>

<script>
let provider;
let signer;
let currentAccount = null;

async function connectWallet() {
  try {
    document.getElementById("error").innerText = "";

    if (!window.ethereum) {
      document.getElementById("error").innerText =
        "MetaMask not installed";
      return;
    }

    provider = new ethers.providers.Web3Provider(window.ethereum);

    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();

    const address = await signer.getAddress();
    currentAccount = address;

    document.getElementById("connectView").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    updateUI();

    fetchBalance();
    fetchXRPPrice();

    listenWalletChanges();

  } catch (err) {
    document.getElementById("error").innerText = err.message;
  }
}

async function updateUI() {
  const network = await provider.getNetwork();
  document.getElementById("networkBadge").innerText =
    network.name + " (" + network.chainId + ")";

  document.getElementById("wallet").innerText = currentAccount;
}

async function fetchBalance() {
  const bal = await provider.getBalance(currentAccount);
  const eth = ethers.utils.formatEther(bal);
  document.getElementById("balance").innerText = parseFloat(eth).toFixed(4) + " ETH";
}

async function fetchXRPPrice() {
  try {
    const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=ripple&vs_currencies=usd");
    const data = await res.json();
    document.getElementById("xrpPrice").innerText =
      "$" + data.ripple.usd;
  } catch {
    document.getElementById("xrpPrice").innerText = "Error loading price";
  }
}

function listenWalletChanges() {
  window.ethereum.on("accountsChanged", (accounts) => {
    if (accounts.length === 0) disconnect();
    else location.reload();
  });

  window.ethereum.on("chainChanged", () => location.reload());
}

function disconnect() {
  provider = null;
  signer = null;
  currentAccount = null;

  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("connectView").classList.remove("hidden");
}
</script>

</body>
</html>
