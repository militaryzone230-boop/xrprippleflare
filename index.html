<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XRPRippleFlare Exchange</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1c;
  color: white;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: #0f172a;
  border-bottom: 1px solid #1e293b;
}

h1 {
  color: #38bdf8;
  font-size: 18px;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
  gap: 15px;
}

.card {
  background: #111827;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(56,189,248,0.08);
}

.value {
  color: #22c55e;
  word-break: break-all;
}

button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #38bdf8;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0ea5e9;
}

.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
}

.modal-box {
  background: #111827;
  padding: 20px;
  border-radius: 12px;
  width: 320px;
}

.option {
  padding: 12px;
  margin-top: 10px;
  background: #1f2937;
  border-radius: 8px;
  cursor: pointer;
}

.option:hover {
  background: #374151;
}

.hidden { display: none; }
</style>
</head>

<body>

<div class="topbar">
  <h1>XRPRippleFlare Exchange</h1>
  <button onclick="openModal()" style="width:auto;">Connect Wallet</button>
</div>

<div class="container">

<div id="dashboard" class="hidden">

  <div class="grid">

    <div class="card">
      <h3>Wallet</h3>
      <div class="value" id="wallet"></div>
    </div>

    <div class="card">
      <h3>Network</h3>
      <div class="value" id="network"></div>
    </div>

  </div>

</div>

</div>

<!-- WALLET MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3>Select Wallet</h3>

    <div class="option" onclick="connectInjected()">
      🦊 MetaMask / Browser Wallet
    </div>

    <div class="option" onclick="connectWC()">
      📱 WalletConnect (Mobile QR)
    </div>

    <div class="option" onclick="closeModal()">
      ❌ Cancel
    </div>
  </div>
</div>

<!-- WalletConnect -->
<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.10.6/dist/index.umd.js"></script>

<script>
let provider;
let signer;

/* MODAL */
function openModal() {
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal() {
  document.getElementById("modal").classList.add("hidden");
}

/* =========================
   INJECTED WALLET (MetaMask / Brave / etc.)
========================= */
async function connectInjected() {
  try {

    if (!window.ethereum) {
      alert("No browser wallet detected. Use WalletConnect.");
      return;
    }

    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();

    const addr = await signer.getAddress();
    const net = await provider.getNetwork();

    showApp(addr, net.name);
    closeModal();

  } catch (e) {
    alert(e.message);
  }
}

/* =========================
   WALLETCONNECT (MOBILE + UNIVERSAL)
========================= */
async function connectWC() {
  try {

    const { EthereumProvider } = window.WalletConnectEthereumProvider;

    const wc = await EthereumProvider.init({
      projectId: "6eb8ae24484e78bb6c25a73a7195d774",
      chains: [1],
      showQrModal: true
    });

    await wc.connect();

    provider = new ethers.providers.Web3Provider(wc);
    signer = provider.getSigner();

    const addr = await signer.getAddress();
    const net = await provider.getNetwork();

    showApp(addr, net.name);
    closeModal();

  } catch (e) {
    alert(e.message);
  }
}

/* =========================
   UI
========================= */
function showApp(address, network) {
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("wallet").innerText = address;
  document.getElementById("network").innerText = network;
}
</script>

</body>
</html>
