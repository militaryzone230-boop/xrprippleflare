<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>XRPRippleFlare</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
    }

    h1 {
      color: #38bdf8;
      margin: 0;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: #0f172a;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(56,189,248,0.15);
    }

    button {
      padding: 12px 18px;
      margin: 10px;
      border: none;
      border-radius: 6px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    #walletAddress {
      margin-top: 15px;
      color: #22c55e;
      word-break: break-all;
    }

    .error {
      color: #ef4444;
    }
  </style>
</head>

<body>

<header>
  <h1>XRPRippleFlare</h1>
  <p>Secure Web3 Wallet Connection</p>
</header>

<div class="container">
  <h2>Connect Wallet</h2>

  <button onclick="connectWallet()">Connect MetaMask</button>
  <button onclick="disconnectWallet()">Disconnect</button>

  <div id="walletAddress"></div>
</div>

<div class="container">
  <h2>Contact</h2>
  <p>Email: Miliyaryzone230@gmail.com</p>
</div>

<script>
let provider;
let signer;

async function connectWallet() {
  try {
    if (!window.ethereum) {
      document.getElementById("walletAddress").innerHTML =
        "<span class='error'>MetaMask not detected. Please install it.</span>";
      return;
    }

    provider = new ethers.providers.Web3Provider(window.ethereum);

    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();

    const address = await signer.getAddress();

    document.getElementById("walletAddress").innerText =
      "Connected: " + address;

  } catch (err) {
    document.getElementById("walletAddress").innerHTML =
      "<span class='error'>Connection failed: " + err.message + "</span>";
  }
}

function disconnectWallet() {
  provider = null;
  signer = null;
  document.getElementById("walletAddress").innerText = "";
}
</script>

</body>
</html>
